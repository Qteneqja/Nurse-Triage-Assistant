name: Trigger auto deployment for nurse-triage-api

on:
  push:
    branches:
      - main
    paths:
      - '**'
      - '.github/workflows/nurse-triage-api-AutoDeployTrigger-58c15c36-b65d-4acc-a121-a29399dcc40c.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.NURSETRIAGEAPI_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.NURSETRIAGEAPI_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.NURSETRIAGEAPI_AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR
        run: |
          ACR_TOKEN=$(az acr login --name nursetriageacr7351 --expose-token --output tsv --query accessToken)
          echo "$ACR_TOKEN" | docker login nursetriageacr7351.azurecr.io \
            --username 00000000-0000-0000-0000-000000000000 \
            --password-stdin

      - name: Build and push image
        run: |
          docker build -t nursetriageacr7351.azurecr.io/nurse-triage-api:${{ github.sha }} .
          docker push nursetriageacr7351.azurecr.io/nurse-triage-api:${{ github.sha }}

      - name: Deploy to Container App
        run: |
          az extension add --name containerapp --upgrade --yes
          az containerapp update \
            --name nurse-triage-api \
            --resource-group nurse-triage-rg \
            --image nursetriageacr7351.azurecr.io/nurse-triage-api:${{ github.sha }}


