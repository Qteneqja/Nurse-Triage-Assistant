name: Trigger auto deployment for nurse-triage-api

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/nurse-triage-api-AutoDeployTrigger-58c15c36-b65d-4acc-a121-a29399dcc40c.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.NURSETRIAGEAPI_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.NURSETRIAGEAPI_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.NURSETRIAGEAPI_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}Dockerfile
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: nursetriageacr6413.azurecr.io
          registryUsername: ${{ secrets.NURSETRIAGEAPI_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.NURSETRIAGEAPI_REGISTRY_PASSWORD }}
          containerAppName: nurse-triage-api
          resourceGroup: nurse-triage-eastus-rg
          imageToBuild: nursetriageacr6413.azurecr.io/nurse-triage-api:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


