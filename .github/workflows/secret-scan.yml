# --------------------------------------------------------------
# Secret Scan (All Branches) - Nurse Triage Assistant
# Purpose: Close the two coverage gaps left by the gitleaks gate in ci.yml:
#   1. ci.yml only triggers on push/PR to main, so secrets pushed to feature
#      branches sit on the public remote unscanned until a PR is opened.
#      -> gitleaks-push scans every push to every branch (event commit range).
#   2. Push/PR scans only cover the event's commit range, never full history.
#      -> gitleaks-full-history scans the entire history weekly and on demand.
#         Known historical findings (rotated DeepSeek key) are suppressed via
#         .gitleaksignore until the history rewrite lands
#         (docs/HISTORY_REWRITE_PROCEDURE.md).
# Date Created: 2026-06-10
# Step: PR 0 - Security Close-Out
# --------------------------------------------------------------
name: Secret Scan (All Branches)

on:
  push:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks-push:
    name: Push-Range Secret Scan
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # so the action can resolve the push base^..head range

      - name: Run gitleaks on pushed commits
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }} # optional for public personal repos

  gitleaks-full-history:
    name: Full-History Secret Scan
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history is the point of this job

      - name: Run gitleaks over full history
        run: |
          GITLEAKS_VERSION=8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks detect --source . --config .gitleaks.toml --redact --no-banner -v
