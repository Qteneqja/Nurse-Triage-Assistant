# --------------------------------------------------------------
# CI Pipeline - Nurse Triage Assistant
# Purpose: Lint, type-check, and run the full test suite on every push/PR.
# Date Created: 2026-03-02
# Step: Production Hardening - Step 5
# --------------------------------------------------------------
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.13"
  APP_ENV: "test"

jobs:
  gitleaks:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for thorough scan

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}  # Required for private repos - optional for public

  lint:
    name: Lint & Formatting
    runs-on: ubuntu-latest
    needs: gitleaks
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.15.4

      - name: Run ruff linter
        run: ruff check src/ tests/ --output-format=github

      - name: Run ruff formatter check
        run: ruff format --check src/ tests/

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov

      - name: Run tests with coverage
        env:
          APP_ENV: test
          DEEPSEEK_API_KEY: ""
          SENTRY_DSN: ""
          TWILIO_VALIDATE_SIGNATURE: "false"
        run: |
          python -m pytest tests/ \
            --ignore=tests/test_intake_flow.py \
            --ignore=tests/integration \
            --ignore=tests/load \
            -v \
            --tb=short \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --junitxml=test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-results.xml
            coverage.xml
          retention-days: 30

  healthcare-evals:
    name: Healthcare Evals (DeepEval)
    runs-on: ubuntu-latest
    needs: lint
    env:
      APP_ENV: test
      RUN_LIVE_LLM_EVALS: "false"
      DEEPSEEK_API_KEY: ""
      SENTRY_DSN: ""
      TWILIO_VALIDATE_SIGNATURE: "false"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run deterministic healthcare evals
        run: deepeval test run tests/evals

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit

      - name: Run bandit (high confidence/high severity)
        run: |
          bandit -r src/ \
            -c pyproject.toml \
            --severity-level high \
            --confidence-level high \
            --format json \
            --output bandit-report.json

      - name: Check dependencies for known vulnerabilities
        run: |
          pip-audit -r requirements.txt \
            --progress-spinner off \
            --format json \
            --output pip-audit-report.json

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            bandit-report.json
            pip-audit-report.json
          retention-days: 30
