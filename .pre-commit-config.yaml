# See https://pre-commit.com for more information
# Install: pip install pre-commit && pre-commit install
repos:
  # ---- Secret / credential leak prevention ----
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks

  # ---- Block committing .env and private key files ----
  - repo: local
    hooks:
      - id: no-env-files
        name: Block .env files
        entry: "bash -c 'echo \"ERROR: .env file detected in commit\" && exit 1'"
        language: system
        files: '(^|/)\.env(\..+)?$'
        types: [file]

      - id: no-private-keys
        name: Block private key files
        entry: "bash -c 'echo \"ERROR: Private key file detected in commit\" && exit 1'"
        language: system
        files: '\.(pem|key|p12|pfx)$'
        types: [file]
