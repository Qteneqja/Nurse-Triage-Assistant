<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ORCA Intake Dashboard</title>
    <link rel="icon" type="image/png" href="/dashboard/static/logo-navy.png" />
    <link rel="stylesheet" href="/dashboard/static/brand.css" />
    <link rel="stylesheet" href="/dashboard/static/dashboard.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <a class="brand-lockup" href="/dashboard">
          <img
            class="brand-emblem"
            src="/dashboard/static/logo-cream.png"
            alt="ORCA — whale tail emblem"
          />
          <span>
            <span class="brand-wordmark">ORCA</span>
            <span class="brand-descriptor">AI Phone Intake</span>
          </span>
        </a>
        <nav class="nav">
          <a href="/dashboard" data-route="/dashboard">Overview</a>
          <a href="/dashboard/records" data-route="/dashboard/records">Records</a>
          <a href="/dashboard/enrichment" data-route="/dashboard/enrichment">Enrichment (preview)</a>
          <a href="/dashboard/sessions" data-route="/dashboard/sessions">Sessions</a>
          <a href="/dashboard/actions" data-route="/dashboard/actions">Actions</a>
        </nav>
        <p class="sidebar-tagline">Every call answered. Every detail captured.</p>
      </aside>
      <main class="main">
        <header class="topbar">
          <div>
            <p class="eyebrow">ORCA Intake Dashboard</p>
            <h1 id="page-title">Overview</h1>
          </div>
          <div class="token-control">
            <label for="token-input">Admin token</label>
            <input id="token-input" type="password" autocomplete="off" />
            <button id="token-save" type="button">Save</button>
          </div>
        </header>
        <section id="content" class="content" aria-live="polite"></section>
      </main>
    </div>
    <script src="/dashboard/static/dashboard.js"></script>
  </body>
</html>
