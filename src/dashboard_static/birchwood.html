<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Birchwood Collision · Intake Dashboard · ORCA</title>
    <link rel="icon" type="image/png" href="/dashboard/static/logo-navy.png" />
    <link rel="stylesheet" href="/dashboard/static/brand.css" />
    <link rel="stylesheet" href="/dashboard/static/birchwood.css" />
  </head>
  <body class="bw-page">
    <header class="bw-header">
      <div class="bw-header-inner">
        <a class="brand-lockup" href="/dashboard/birchwood">
          <img
            class="brand-emblem"
            src="/dashboard/static/logo-cream.png"
            alt="ORCA — whale tail emblem"
          />
          <span>
            <span class="brand-wordmark">ORCA</span>
            <span class="brand-descriptor">AI Phone Intake</span>
          </span>
        </a>
        <span class="bw-divider" aria-hidden="true"></span>
        <!-- TODO: drop in the Birchwood logo asset beside the ORCA mark when
             supplied; until then the client identity is typographic only. -->
        <div class="bw-client">
          <p class="bw-client-name">Birchwood Collision</p>
          <p class="bw-client-kicker">Built for Birchwood · Powered by ORCA</p>
        </div>
      </div>
    </header>
    <main class="bw-main">
      <section id="bw-content" class="bw-content" aria-live="polite"></section>
    </main>
    <footer class="bw-footer">
      <p class="bw-footer-tagline">Every call answered. Every detail captured.</p>
      <p id="bw-value-line" class="bw-footer-value"></p>
    </footer>
    <script src="/dashboard/static/birchwood.js"></script>
  </body>
</html>
