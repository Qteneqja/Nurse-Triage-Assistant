## Production-like docker-compose overlay
##
## Usage:
##   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
##
## Differences from base:
##   - Uses gunicorn + uvicorn workers for multi-process serving
##   - Forces APP_ENV=production and stricter defaults
##   - No port-binding for Postgres (accessed only from API container)
##   - Resource limits

version: "3.9"

services:
  postgres:
    ports: !reset [] # do not expose Postgres to host in prod

  api:
    command:
      - "gunicorn"
      - "src.main:app"
      - "-k"
      - "uvicorn.workers.UvicornWorker"
      - "--bind"
      - "0.0.0.0:8000"
      - "--workers"
      - "4"
      - "--timeout"
      - "120"
      - "--graceful-timeout"
      - "30"
      - "--access-logfile"
      - "-"
    environment:
      - APP_ENV=production
      - ENVIRONMENT=production
      - STORAGE_BACKEND=postgres
      - DATABASE_URL=postgresql://triage:${POSTGRES_PASSWORD}@postgres:5432/triage_db
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-chat}
      - LOG_FORMAT=json
      - TRUST_PROXY_HEADERS=true
      - TWILIO_VALIDATE_SIGNATURE=true
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN}
      - TWILIO_WEBHOOK_BASE_URL=${TWILIO_WEBHOOK_BASE_URL}
      - RUN_MIGRATIONS_ON_STARTUP=${RUN_MIGRATIONS_ON_STARTUP:-true}
      - SENTRY_DSN=${SENTRY_DSN}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1024M
