[pytest]
asyncio_mode = strict
testpaths = tests

# Tests excluded from the default run (require a live server or infra):
#   tests/test_intake_flow.py  — needs FastAPI server on port 8001
#   tests/integration/         — needs a live server
#   tests/load/                — load tests, need a live server
# Run them explicitly when the server is up:
#   pytest tests/test_intake_flow.py
#   pytest tests/integration/
addopts = --ignore=tests/test_intake_flow.py --ignore=tests/integration --ignore=tests/load
